name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macOS
          - os: windows-latest
            artifact: Windows
          - os: ubuntu-latest
            artifact: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Prepare Linux Python with Tk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install build tools on macOS and Windows
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements-build.txt
      - name: Install build tools on Linux
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pip install -r requirements-build.txt
      - name: Build app
        if: runner.os != 'macOS'
        run: pyinstaller --noconfirm --windowed --name "Tonverk Kit Forge" app.py
      - name: Build native macOS app
        if: runner.os == 'macOS'
        run: bash macOS/build_app.sh "dist/Tonverk Kit Forge.app"
      - name: Package app
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          dist = Path("dist")
          name = "Tonverk-Kit-Forge-${{ matrix.artifact }}"
          if os.name == "nt":
              source = dist / "Tonverk Kit Forge"
              archive = Path(f"{name}.zip")
              shutil.make_archive(str(archive.with_suffix("")), "zip", root_dir=dist, base_dir=source.name)
          elif os.uname().sysname == "Darwin":
              source = dist / "Tonverk Kit Forge.app"
              archive = Path(f"{name}.zip")
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as z:
                  for file in source.rglob("*"):
                      z.write(file, file.relative_to(dist))
          else:
              source = dist / "Tonverk Kit Forge"
              archive = Path(f"{name}.tar.gz")
              import tarfile
              with tarfile.open(archive, "w:gz") as tar:
                  tar.add(source, arcname=source.name)
          print(archive)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Tonverk-Kit-Forge-${{ matrix.artifact }}
          path: Tonverk-Kit-Forge-${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
